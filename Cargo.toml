[package]
name = "below-stairs"
version = "0.1.0"
edition = "2021"
description = "Below Stairs, Above Stars - a sci-fi visual novel set on an O'Neill cylinder, with a visual story editor"

[dependencies]
minifb = { version = "0.27", default-features = false, features = ["x11"] }
font8x8 = "0.3"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rodio = { version = "0.20", optional = true, default-features = false, features = ["flac", "vorbis", "wav", "mp3"] }
ureq = { version = "2", default-features = false, features = ["json"] }
bevy = { version = "0.16", optional = true, default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log",
    "bevy_asset", "bevy_color", "bevy_window", "bevy_winit", "x11",
    "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_sprite", "tonemapping_luts", "png", "jpeg",
    "bevy_scene", "bevy_gltf",
] }

bevy_mod_openxr = { version = "0.3", optional = true }
bevy_mod_xr = { version = "0.3", optional = true }
bevy_xr_utils = { version = "0.3", optional = true }

[features]
# Sound needs an audio library at build time (on Linux: ALSA development
# files, e.g. libasound2-dev). Build with --no-default-features to do without.
default = ["audio"]
audio = ["dep:rodio"]
# Walking through locations in 3D uses the Bevy engine: a large dependency
# (several minutes to build the first time), so it is opt-in:
#   cargo run --release --features world3d
world3d = ["dep:bevy"]
# The same world in a VR headset, through OpenXR (needs an OpenXR runtime
# such as SteamVR or Monado at run time):
#   cargo run --release --features vr -- --vr
vr = ["world3d", "dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:bevy_xr_utils"]

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
