[package]
name = "below-stairs"
version = "0.1.0"
edition = "2021"
description = "Below Stairs, Above Stars - a sci-fi visual novel set on an O'Neill cylinder, with a visual story editor"

[dependencies]
minifb = { version = "0.27", default-features = false, features = ["x11"] }
font8x8 = "0.3"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
