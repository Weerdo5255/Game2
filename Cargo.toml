[package]
name = "below-stairs"
version = "0.1.0"
edition = "2021"
description = "Below Stairs, Above Stars - a 16-bit style sci-fi visual novel set on an O'Neill cylinder"

[dependencies]
minifb = { version = "0.27", default-features = false, features = ["x11"] }
font8x8 = "0.3"
png = "0.17"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
